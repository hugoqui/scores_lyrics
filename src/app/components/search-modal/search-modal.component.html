<StackLayout class="container">
  <TextField hint="Buscar canto..." (textChange)="onSearchChange($event)" class="search-box" #searchInput></TextField>

  <GridLayout rows="" columns="" marginTop="10">    
    <ListView [items]="songList()" class="list-group" height="100%">
      <ng-template let-song>
        <Label [text]="song.fileName" class="list-group-item" (tap)="selectSong(song)"></Label>
      </ng-template>
    </ListView>
  </GridLayout>
</StackLayout>
