name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar
        run: dotnet restore Symphony.sln

      - name: Verificar formato
        run: dotnet format Symphony.sln --verify-no-changes

      - name: Compilar (advertencias como errores)
        run: dotnet build Symphony.sln --no-restore --configuration Release

      - name: Probar
        run: dotnet test Symphony.sln --no-build --configuration Release
