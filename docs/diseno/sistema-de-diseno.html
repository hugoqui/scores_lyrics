document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 verificado<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <nav style=\"display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 56px;\">\n    <a href=\"#marca\" style=\"font-size: 12px; font-weight: 500; color: #4A5568; text-decoration: none; border: 1px solid #DCE1E8; background: #FFFFFF; border-radius: 4px; padding: 5px 10px;\" style-hover=\"border-color: #838C9B; color: #101828;\">Marca<\u002Fa>\n    <a href=\"#tokens\" style=\"font-size: 12px; font-weight: 500; color: #4A5568; text-decoration: none; border: 1px solid #DCE1E8; background: #FFFFFF; border-radius: 4px; padding: 5px 10px;\" style-hover=\"border-color: #838C9B; color: #101828;\">Tokens<\u002Fa>\n    <a href=\"#tipografia\" style=\"font-size: 12px; font-weight: 500; color: #4A5568; text-decoration: none; border: 1px solid #DCE1E8; background: #FFFFFF; border-radius: 4px; padding: 5px 10px;\" style-hover=\"border-color: #838C9B; color: #101828;\">Tipografía y espacio<\u002Fa>\n    <a href=\"#componentes\" style=\"font-size: 12px; font-weight: 500; color: #4A5568; text-decoration: none; border: 1px solid #DCE1E8; background: #FFFFFF; border-radius: 4px; padding: 5px 10px;\" style-hover=\"border-color: #838C9B; color: #101828;\">Componentes<\u002Fa>\n    <a href=\"#accesibilidad\" style=\"font-size: 12px; font-weight: 500; color: #4A5568; text-decoration: none; border: 1px solid #DCE1E8; background: #FFFFFF; border-radius: 4px; padding: 5px 10px;\" style-hover=\"border-color: #838C9B; color: #101828;\">Accesibilidad<\u002Fa>\n  <\u002Fnav>\n\n  <!-- ══ MARCA ══ -->\n  <section id=\"marca\" style=\"margin-bottom: 64px;\">\n    <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #667085; margin-bottom: 8px;\">01 · README<\u002Fdiv>\n    <h2 style=\"font-size: 25px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 12px;\">La marca en una frase<\u002Fh2>\n    <p style=\"font-size: 14px; line-height: 1.65; color: #4A5568; max-width: 72ch; margin: 0 0 28px; text-wrap: pretty;\">Azul marino profundo como superficie, dorado cálido como único acento. El panel administra licencias, iglesias y credenciales: el color no decora, informa. Si un elemento tiene color, es porque significa algo.<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 28px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 16px;\">\n        <div style=\"height: 56px; border-radius: 4px; background: #0B1220; margin-bottom: 12px;\"><\u002Fdiv>\n        <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 4px;\">Azul marino · #0B1220<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #4A5568; line-height: 1.5;\">Fondo del tema oscuro y del icono. Nunca como acento en tema claro.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 16px;\">\n        <div style=\"height: 56px; border-radius: 4px; background: #D9A441; margin-bottom: 12px;\"><\u002Fdiv>\n        <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 4px;\">Dorado · #D9A441<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #4A5568; line-height: 1.5;\">Acento único. Como superficie en ambos temas; como texto solo en oscuro.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 16px;\">\n        <div style=\"height: 56px; border-radius: 4px; background: #8A6114; margin-bottom: 12px;\"><\u002Fdiv>\n        <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 4px;\">Oro tinta · #8A6114<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #4A5568; line-height: 1.5;\">Variante oscurecida obligatoria para texto e iconos dorados en tema claro (5,53:1).<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 16px;\">\n        <div style=\"height: 56px; border-radius: 4px; background: #F4F6F8; border: 1px solid #DCE1E8; display: flex; align-items: center; justify-content: center; font-family: 'Italianno', cursive; font-size: 34px; color: #101828; margin-bottom: 12px;\">Symphony<\u002Fdiv>\n        <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 4px;\">Wordmark caligráfico<\u002Fdiv>\n        <div style=\"font-size: 12px; color: #4A5568; line-height: 1.5;\">Solo como logo: cabecera, acceso y correo. Jamás como tipografía de interfaz.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 18px 20px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #146B3E; margin-bottom: 12px;\">Sí<\u002Fdiv>\n        <ul style=\"margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; color: #101828;\">\n          <li>Separar superficies con un borde sutil y un salto pequeño de luminosidad; sombra en capas solo en lo que flota de verdad.<\u002Fli>\n          <li>Dorado como acento único: acción principal, selección, marca.<\u002Fli>\n          <li>Verde, ámbar y rojo reservados a estado, siempre con texto al lado.<\u002Fli>\n          <li>Definir los dos temas por separado, token a token.<\u002Fli>\n          <li>Densidad: muchas filas visibles sin hacer scroll.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 18px 20px;\">\n        <div style=\"font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #B3261E; margin-bottom: 12px;\">No<\u002Fdiv>\n        <ul style=\"margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.7; color: #101828;\">\n          <li>Glassmorphism, cristal esmerilado, desenfoques o texto sobre translúcido.<\u002Fli>\n          <li>Gradientes de marca en fondos, botones o iconos.<\u002Fli>\n          <li>Púrpura y violeta en cualquier rol.<\u002Fli>\n          <li>Iconos con fondo de color decorativo.<\u002Fli>\n          <li>Sombras enormes y difusas tipo Soft UI: a treinta filas lo vuelven todo algodón.<\u002Fli>\n          <li>Titulares enormes: esto es una herramienta, no una landing.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ TOKENS ══ -->\n  <section id=\"tokens\" style=\"margin-bottom: 64px;\">\n    <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #667085; margin-bottom: 8px;\">02 · Tokens de color<\u002Fdiv>\n    <h2 style=\"font-size: 25px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 12px;\">Dos temas, definidos por separado<\u002Fh2>\n    <p style=\"font-size: 14px; line-height: 1.65; color: #4A5568; max-width: 72ch; margin: 0 0 8px; text-wrap: pretty;\">El tema oscuro no es el claro invertido. Cada token se eligió contra su propio fondo y lleva anotado el ratio real medido. Texto normal ≥ 4,5:1; bordes de control e indicadores no textuales ≥ 3:1.<\u002Fp>\n    <p style=\"font-size: 13px; line-height: 1.6; color: #101828; background: #FBF0D8; border: 1px solid #B1842A; border-radius: 4px; padding: 10px 14px; max-width: 72ch; margin: 0 0 28px;\"><strong>Restricción dura:<\u002Fstrong> el dorado #D9A441 da 2,25:1 sobre blanco. En tema claro va en fondos, bordes y superficies de acento con texto oscuro encima; para texto o iconos dorados en claro se usa <strong>oro tinta #8A6114<\u002Fstrong> (5,53:1).<\u002Fp>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px;\">\n\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; overflow: hidden;\">\n        <div style=\"padding: 14px 18px; border-bottom: 1px solid #DCE1E8; display: flex; align-items: baseline; gap: 10px;\">\n          <span style=\"font-size: 14px; font-weight: 600;\">Tema claro<\u002Fspan>\n          <span style=\"font-size: 12px; color: #667085;\">--sym-*<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ tokensLight }}\" as=\"t\" hint-placeholder-count=\"10\">\n          <div style=\"display: grid; grid-template-columns: 28px 1fr 96px 74px; gap: 12px; align-items: center; padding: 9px 18px; border-bottom: 1px solid #EAEDF2;\">\n            <div style=\"width: 28px; height: 28px; border-radius: 4px; border: 1px solid #DCE1E8; background: {{ t.hex }};\"><\u002Fdiv>\n            <div style=\"min-width: 0;\">\n              <div style=\"font-size: 12.5px; font-weight: 500; font-family: 'IBM Plex Mono', monospace; letter-spacing: -0.01em;\">{{ t.name }}<\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #4A5568; line-height: 1.45;\">{{ t.use }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 11.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">{{ t.hex }}<\u002Fdiv>\n            <sc-if value=\"{{ showRatios }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size: 11px; text-align: right; color: #101828; font-family: 'IBM Plex Mono', monospace;\">{{ t.ratio }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"background: #0B1220; border: 1px solid #2A3854; border-radius: 6px; overflow: hidden;\">\n        <div style=\"padding: 14px 18px; border-bottom: 1px solid #2A3854; display: flex; align-items: baseline; gap: 10px;\">\n          <span style=\"font-size: 14px; font-weight: 600; color: #E9EEF8;\">Tema oscuro<\u002Fspan>\n          <span style=\"font-size: 12px; color: #8492AC;\">--sym-*<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ tokensDark }}\" as=\"t\" hint-placeholder-count=\"10\">\n          <div style=\"display: grid; grid-template-columns: 28px 1fr 96px 74px; gap: 12px; align-items: center; padding: 9px 18px; border-bottom: 1px solid #1A2540;\">\n            <div style=\"width: 28px; height: 28px; border-radius: 4px; border: 1px solid #2A3854; background: {{ t.hex }};\"><\u002Fdiv>\n            <div style=\"min-width: 0;\">\n              <div style=\"font-size: 12.5px; font-weight: 500; font-family: 'IBM Plex Mono', monospace; letter-spacing: -0.01em; color: #E9EEF8;\">{{ t.name }}<\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #A8B4CB; line-height: 1.45;\">{{ t.use }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 11.5px; font-family: 'IBM Plex Mono', monospace; color: #8492AC;\">{{ t.hex }}<\u002Fdiv>\n            <sc-if value=\"{{ showRatios }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"font-size: 11px; text-align: right; color: #E9EEF8; font-family: 'IBM Plex Mono', monospace;\">{{ t.ratio }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 24px; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 18px 20px;\">\n      <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 8px;\">La regla más importante del sistema<\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 1.65; color: #4A5568; margin: 0 0 14px; max-width: 78ch;\">Verde, ámbar y rojo se usan <strong>solo para estado<\u002Fstrong>. Nunca para decorar, nunca para diferenciar cosas que no son estados (ni categorías, ni planes, ni gráficas).<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px;\">\n        <div style=\"border: 1px solid #5FA37C; border-left: 4px solid #146B3E; background: #E6F5EC; border-radius: 4px; padding: 12px 14px;\">\n          <div style=\"font-size: 13px; font-weight: 600; color: #146B3E; margin-bottom: 4px;\">Verde · vigente<\u002Fdiv>\n          <div style=\"font-size: 12px; color: #101828; line-height: 1.5;\">Activo y en regla. No requiere ninguna acción.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid #B1842A; border-left: 4px solid #8A5A05; background: #FBF0D8; border-radius: 4px; padding: 12px 14px;\">\n          <div style=\"font-size: 13px; font-weight: 600; color: #8A5A05; margin-bottom: 4px;\">Ámbar · advertencia que no bloquea<\u002Fdiv>\n          <div style=\"font-size: 12px; color: #101828; line-height: 1.5;\">Se ha pasado un límite y se puede seguir trabajando igual. Informa, no interrumpe, no deshabilita nada.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid #C96A62; border-left: 4px solid #B3261E; background: #FBEBE9; border-radius: 4px; padding: 12px 14px;\">\n          <div style=\"font-size: 13px; font-weight: 600; color: #B3261E; margin-bottom: 4px;\">Rojo · bloqueado o destructivo<\u002Fdiv>\n          <div style=\"font-size: 12px; color: #101828; line-height: 1.5;\">La acción no se puede completar (licencia vencida impide dar de alta) o destruye algo.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 12.5px; line-height: 1.6; color: #4A5568; margin: 14px 0 0;\">Ámbar y rojo se distinguen de un vistazo por tres señales simultáneas: tono, barra lateral de 4px y forma del icono (triángulo <span style=\"font-family: 'IBM Plex Mono', monospace;\">▲<\u002Fspan> para advertencia, octágono/aspa <span style=\"font-family: 'IBM Plex Mono', monospace;\">✕<\u002Fspan> para bloqueo). Nunca solo por el tono.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ TIPOGRAFÍA / ESPACIO ══ -->\n  <section id=\"tipografia\" style=\"margin-bottom: 64px;\">\n    <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #667085; margin-bottom: 8px;\">03 · Tipografía, espacio, radio, foco<\u002Fdiv>\n    <h2 style=\"font-size: 25px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 20px;\">Escala compacta<\u002Fh2>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 24px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 18px 20px;\">\n        <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 4px;\">IBM Plex Sans · interfaz<\u002Fdiv>\n        <div style=\"font-size: 12.5px; color: #4A5568; line-height: 1.6; margin-bottom: 8px;\">Neo-grotesca, no geométrica: estrecha, así caben más columnas en una tabla densa. Licencia OFL y descargable como archivo, de modo que la app móvil y la de escritorio la empaquetan y funcionan sin internet. Cifras tabulares (<span style=\"font-family: 'IBM Plex Mono', monospace;\">tnum<\u002Fspan>) en toda columna numérica.<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 14px; background: #F4F6F8; border: 1px solid #DCE1E8; border-radius: 4px; padding: 10px 12px; margin-bottom: 16px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: .06em; color: #101828; flex: none; white-space: nowrap;\">1 l I 0 O<\u002Fdiv>\n          <div style=\"font-size: 11.5px; color: #4A5568; line-height: 1.5;\">El uno lleva base, la ele va curvada, la i mayúscula lleva remates y el cero va ranurado. El código de invitación se teclea a mano desde un mensaje: dos caracteres confundibles son alguien que no entra.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #667085; margin-bottom: 10px;\">Cuatro tamaños, saltos que se notan<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid #EAEDF2; padding-bottom: 9px;\"><span style=\"font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #667085; width: 132px; flex: none;\">meta 11 / 600<\u002Fspan><span style=\"font-size: 11px; font-weight: 600; color: #667085; letter-spacing: .08em; text-transform: uppercase;\">Etiqueta, encabezado de grupo<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid #EAEDF2; padding-bottom: 9px;\"><span style=\"font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #667085; width: 132px; flex: none;\">label 11,5 / 500<\u002Fspan><span style=\"font-size: 11.5px; font-weight: 500; color: #4A5568;\">Etiqueta de un dato<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid #EAEDF2; padding-bottom: 9px;\"><span style=\"font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #667085; width: 132px; flex: none;\">body 13 / 400<\u002Fspan><span style=\"font-size: 13px; font-weight: 400; color: #101828;\">Cuerpo, celda, descripción<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid #EAEDF2; padding-bottom: 9px;\"><span style=\"font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #667085; width: 132px; flex: none;\">data 13 / 600<\u002Fspan><span style=\"font-size: 13px; font-weight: 600; color: #101828; font-variant-numeric: tabular-nums;\">El dato mismo · 43 / 40<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid #EAEDF2; padding-bottom: 9px;\"><span style=\"font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #667085; width: 132px; flex: none;\">title 16 / 700<\u002Fspan><span style=\"font-size: 16px; font-weight: 700; color: #101828;\">Título de tarjeta o de panel<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 14px;\"><span style=\"font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #667085; width: 132px; flex: none;\">display 25 / 700<\u002Fspan><span style=\"font-size: 25px; font-weight: 700; letter-spacing: -0.015em;\">Título de sección<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 18px 20px;\">\n          <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 12px;\">Espaciado · base 4px<\u002Fdiv>\n          <div style=\"display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap;\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 4px; height: 4px; background: #8A6114;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">1·4<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 8px; height: 8px; background: #8A6114;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">2·8<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 12px; height: 12px; background: #8A6114;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">3·12<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 16px; height: 16px; background: #8A6114;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">4·16<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 20px; height: 20px; background: #8A6114;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">5·20<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 24px; height: 24px; background: #8A6114;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">6·24<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 32px; height: 32px; background: #8A6114;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">8·32<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; color: #4A5568; margin-top: 12px; line-height: 1.5;\">Celda de tabla 8/12. Interior de tarjeta 16/20. Separación entre bloques 24. Nada por encima de 32 dentro del panel.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 18px 20px;\">\n          <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 12px;\">Radio y foco<\u002Fdiv>\n          <div style=\"display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 14px;\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 48px; height: 32px; border: 1px solid #838C9B; border-radius: 2px;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">2 · badge<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 48px; height: 32px; border: 1px solid #838C9B; border-radius: 4px;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">4 · control<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px;\"><div style=\"width: 48px; height: 32px; border: 1px solid #838C9B; border-radius: 6px;\"><\u002Fdiv><span style=\"font-size: 10.5px; font-family: 'IBM Plex Mono', monospace; color: #667085;\">6 · contenedor<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; flex-wrap: wrap; align-items: center;\">\n            <div style=\"background: #F4F6F8; padding: 12px; border-radius: 4px;\"><button type=\"button\" style=\"font: 600 13px 'IBM Plex Sans', sans-serif; background: #D9A441; color: #23190A; border: 1px solid #A87A20; border-radius: 4px; padding: 6px 12px; outline: 2px solid #8A6114; outline-offset: 2px; cursor: pointer;\">Foco en claro<\u002Fbutton><\u002Fdiv>\n            <div style=\"background: #0B1220; padding: 12px; border-radius: 4px;\"><button type=\"button\" style=\"font: 600 13px 'IBM Plex Sans', sans-serif; background: #D9A441; color: #0B1220; border: 1px solid #D9A441; border-radius: 4px; padding: 6px 12px; outline: 2px solid #E8B75C; outline-offset: 2px; cursor: pointer;\">Foco en oscuro<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 12px; color: #4A5568; margin-top: 12px; line-height: 1.5;\">Contorno de 2px con 2px de separación, nunca solo un cambio de fondo. El foco es dorado en los dos temas. Claro: oro tinta <span style=\"font-family: 'IBM Plex Mono', monospace;\">#8A6114<\u002Fspan> (5,53:1). Oscuro: <span style=\"font-family: 'IBM Plex Mono', monospace;\">#E8B75C<\u002Fspan> (10,13:1).<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 24px; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 18px 20px;\">\n      <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 4px;\">Elevación · escala de cuatro<\u002Fdiv>\n      <div style=\"font-size: 12.5px; color: #4A5568; line-height: 1.6; margin-bottom: 16px; max-width: 80ch;\">Sombras en capas, pequeñas y de baja opacidad — nunca una sola sombra grande y difusa. Solo lo que flota de verdad (panel lateral y diálogo) lleva sombra; tarjetas y tabla se separan con borde y un salto pequeño de luminosidad. En tema oscuro, sombra <em>más<\u002Fem> borde: la sombra sola no se ve.<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;\">\n        <div style=\"background: #F4F6F8; border-radius: 4px; padding: 14px;\">\n          <div style=\"height: 44px; background: #F4F6F8; border: 1px solid #DCE1E8; border-radius: 4px; margin-bottom: 10px;\"><\u002Fdiv>\n          <div style=\"font-size: 12px; font-weight: 600; font-family: 'IBM Plex Mono', monospace;\">elev-0 · plana<\u002Fdiv>\n          <div style=\"font-size: 11.5px; color: #4A5568; line-height: 1.5;\">Fondo y filas. Sin sombra.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #F4F6F8; border-radius: 4px; padding: 14px;\">\n          <div style=\"height: 44px; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 4px; margin-bottom: 10px;\"><\u002Fdiv>\n          <div style=\"font-size: 12px; font-weight: 600; font-family: 'IBM Plex Mono', monospace;\">elev-1 · tarjeta<\u002Fdiv>\n          <div style=\"font-size: 11.5px; color: #4A5568; line-height: 1.5;\">Borde + salto de luminosidad. Sin sombra.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #F4F6F8; border-radius: 4px; padding: 14px;\">\n          <div style=\"height: 44px; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 4px; margin-bottom: 10px; box-shadow: -1px 0 2px rgba(16, 24, 40, .05), -4px 0 8px rgba(16, 24, 40, .06), -14px 0 28px rgba(16, 24, 40, .08);\"><\u002Fdiv>\n          <div style=\"font-size: 12px; font-weight: 600; font-family: 'IBM Plex Mono', monospace;\">elev-2 · panel lateral<\u002Fdiv>\n          <div style=\"font-size: 11.5px; color: #4A5568; line-height: 1.5;\">Tres capas proyectadas hacia la izquierda.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #F4F6F8; border-radius: 4px; padding: 14px;\">\n          <div style=\"height: 44px; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 4px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 6px 12px rgba(16, 24, 40, .10), 0 18px 36px rgba(16, 24, 40, .12);\"><\u002Fdiv>\n          <div style=\"font-size: 12px; font-weight: 600; font-family: 'IBM Plex Mono', monospace;\">elev-3 · diálogo<\u002Fdiv>\n          <div style=\"font-size: 11.5px; color: #4A5568; line-height: 1.5;\">Lo único que se pone por encima de todo.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top: 14px; font-size: 12.5px; color: #4A5568; line-height: 1.6; max-width: 80ch;\">Degradado: un paso muy sutil del mismo tono, bajo la cabecera de tabla y en el canto de la barra lateral. <strong>Nunca debajo de texto<\u002Fstrong> — si la luminosidad cambia bajo una etiqueta, el contraste deja de ser medible. Los campos de formulario no llevan sombra interior ni degradado.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ══ COMPONENTES ══ -->\n  <section id=\"componentes\">\n    <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #667085; margin-bottom: 8px;\">04 · Componentes<\u002Fdiv>\n    <h2 style=\"font-size: 25px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 28px;\">Previsualización en claro y oscuro<\u002Fh2>\n\n    <!-- BOTÓN -->\n    <article style=\"margin-bottom: 40px; background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; overflow: hidden;\">\n      <div style=\"padding: 16px 20px; border-bottom: 1px solid #DCE1E8;\">\n        <div style=\"font-size: 16px; font-weight: 700; letter-spacing: -0.01em;\">Botón<\u002Fdiv>\n        <sc-if value=\"{{ showGuidance }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size: 12.5px; color: #4A5568; line-height: 1.55; margin-top: 4px; max-width: 80ch;\">Cada botón lleva el verbo de lo que hace: «Crear iglesia», «Emitir invitación», «Revocar licencia». Nunca «Guardar cambios», «Enviar» ni «Aceptar». Un solo botón dorado por pantalla. Destructivo solo cuando algo se pierde, y siempre tras confirmación. <strong>Una sola salida<\u002Fstrong>, y es un enlace discreto que no compite con la acción principal: nunca «Cancelar» y «Descartar» a la vez.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: {{ previewCols }}; gap: 0;\">\n        <sc-if value=\"{{ showLight }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background: #F4F6F8; padding: 20px; border-right: 1px solid #DCE1E8;\">\n            <div style=\"font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #667085; margin-bottom: 14px;\">Claro<\u002Fdiv>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px;\">\n              <button type=\"button\" style=\"font: 600 13px 'IBM Plex Sans', sans-serif; background: #D9A441; color: #23190A; border: 1px solid #A87A20; border-radius: 4px; padding: 7px 14px; cursor: pointer;\" style-hover=\"background: #C79233;\" style-active=\"background: #B07F27;\" style-focus=\"outline: 2px solid #8A6114; outline-offset: 2px;\">Crear iglesia<\u002Fbutton>\n              <button type=\"button\" style=\"font: 600 13px 'IBM Plex Sans', sans-serif; background: #FFFFFF; color: #101828; border: 1px solid #838C9B; border-radius: 4px; padding: 7px 14px; cursor: pointer;\" style-hover=\"background: #EAEDF2;\" style-active=\"background: #DCE1E8;\" style-focus=\"outline: 2px solid #8A6114; outline-offset: 2px;\">Emitir invitación<\u002Fbutton>\n              <button type=\"button\" style=\"font: 600 13px 'IBM Plex Sans', sans-serif; background: #B3261E; color: #FFFFFF; border: 1px solid #8F1E18; border-radius: 4px; padding: 7px 14px; cursor: pointer;\" style-hover=\"background: #971F19;\" style-active=\"background: #7E1A14;\" st  <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fsection>\n\n  <!-- ══ ACCESIBILIDAD ══ -->\n  <section id=\"accesibilidad\">\n    <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #667085; margin-bottom: 8px;\">05 · Accesibilidad<\u002Fdiv>\n    <h2 style=\"font-size: 25px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 20px;\">Cuatro reglas que no se negocian<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;\">\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 16px 18px;\">\n        <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 6px;\">1 · Contraste medido, no estimado<\u002Fdiv>\n        <div style=\"font-size: 12.5px; color: #4A5568; line-height: 1.6;\">4,5:1 en texto y 3:1 en bordes de control, en los dos temas. Cada token lleva su ratio anotado arriba; si un color nuevo no se puede anotar, no entra.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 16px 18px;\">\n        <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 6px;\">2 · Foco con contorno propio<\u002Fdiv>\n        <div style=\"font-size: 12.5px; color: #4A5568; line-height: 1.6;\">Contorno de 2px con separación de 2px en todo lo pulsable, en ambos temas. Nunca solo un cambio de fondo.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 16px 18px;\">\n        <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 6px;\">3 · Nada se entiende solo por el color<\u002Fdiv>\n        <div style=\"font-size: 12.5px; color: #4A5568; line-height: 1.6;\">Cada estado lleva texto y forma de icono propia. El color confirma lo que la palabra ya dice.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFFFFF; border: 1px solid #DCE1E8; border-radius: 6px; padding: 16px 18px;\">\n        <div style=\"font-size: 14px; font-weight: 700; margin-bottom: 6px;\">4 · Nada depende del ratón<\u002Fdiv>\n        <div style=\"font-size: 12.5px; color: #4A5568; line-height: 1.6;\">Las acciones de fila están siempre presentes; el hover solo refuerza. Todo el panel se recorre con Tab en un orden que sigue la lectura.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;previewMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Ambos&quot;,&quot;Claro&quot;,&quot;Oscuro&quot;],&quot;default&quot;:&quot;Ambos&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Previsualización&quot;},&quot;showRatios&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Previsualización&quot;},&quot;showGuidance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Previsualización&quot;}}\">\nclass Component extends DCLogic {\n  state = { drawerClaro: false, drawerOscuro: false, dialogoClaro: false, dialogoOscuro: false, copiadoClaro: false, copiadoOscuro: false, langClaro: 'ES', langOscuro: 'ES' };\n\n  copiar(key) {\n    this.setState({ [key]: true });\n    clearTimeout(this['t_' + key]);\n    this['t_' + key] = setTimeout(() => this.setState({ [key]: false }), 1800);\n  }\n\n  renderVals() {\n    const mode = this.props.previewMode ?? 'Ambos';\n    const showLight = mode !== 'Oscuro';\n    const showDark = mode !== 'Claro';\n\n    const L = (fg, bg, bd) => ({ lFg: fg, lBg: bg, lBd: bd });\n    const D = (fg, bg, bd) => ({ dFg: fg, dBg: bg, dBd: bd });\n    const est = {\n      vigente: { estado: 'Vigente', icon: '●', ...L('#146B3E', '#E6F5EC', '#4F9670'), ...D('#4ADE80', '#10331F', '#2E7D52') },\n      porVencer: { estado: 'Por vencer', icon: '▲', ...L('#8A5A05', '#FBF0D8', '#B1842A'), ...D('#F5B841', '#36280C', '#96742A') },\n      vencida: { estado: 'Vencida', icon: '◷', ...L('#B3261E', '#FFFFFF', '#C96A62'), ...D('#FF8A85', '#131D30', '#B4565A') },\n      revocada: { estado: 'Revocada', icon: '✕', ...L('#FFFFFF', '#B3261E', '#8F1E18'), ...D('#0B1220', '#FF8A85', '#FF8A85') },\n      suspendida: { estado: 'Suspendida', icon: '‖', ...L('#4A5568', '#EAEDF2', '#838C9B'), ...D('#A8B4CB', '#1A2540', '#5E719A') }\n    };\n    const base = [\n      ['Iglesia Buen Pastor', 'Marta Ruiz', '43 / 40', 'porVencer'],\n      ['Comunidad El Redentor', 'Javier Nieto', '18 / 25', 'vigente'],\n      ['Parroquia San Andrés', 'Lucía Peña', '7 / 15', 'vigente'],\n      ['Centro Cristiano Emaús', 'Diego Salas', '31 / 30', 'vencida'],\n      ['Iglesia La Viña Norte', 'Ana Beltrán', '120 / 150', 'vigente'],\n      ['Capilla del Sagrado Coro', 'Pablo Ortiz', '9 / 10', 'suspendida'],\n      ['Misión Nueva Vida', 'Rocío Cano', '4 / 10', 'vigente'],\n      ['Asamblea Monte Sion', 'Tomás Vidal', '0 / 20', 'revocada'],\n      ['Iglesia Puerta Abierta', 'Elena Mora', '66 / 80', 'vigente']\n    ];\n    const rows = base.map(([iglesia, persona, dispositivos, k]) => ({ iglesia, persona, dispositivos, ...est[k] }));\n\n    const tokensLight = [\n      { name: 'surface-bg', hex: '#F4F6F8', use: 'Fondo de la aplicación', ratio: '—' },\n      { name: 'surface', hex: '#FFFFFF', use: 'Superficie elevada: tarjeta, tabla, drawer', ratio: '1,17:1 vs bg' },\n      { name: 'surface-sunken', hex: '#EAEDF2', use: 'Cabecera de tabla, zona de acciones', ratio: '1,17:1 vs surface' },\n      { name: 'border', hex: '#DCE1E8', use: 'Separador decorativo (no control)', ratio: '1,31:1 · decorativo' },\n      { name: 'border-strong', hex: '#838C9B', use: 'Borde de control: input, botón secundario', ratio: '3,39:1 ✓ AA no textual' },\n      { name: 'text', hex: '#101828', use: 'Texto principal', ratio: '17,7 8A6114', use: 'Contorno de foco (oro tinta, de marca)', ratio: '5,53:1 ✓' }\n    ];\n    const tokensDark = [\n      { name: 'surface-bg', hex: '#0B1220', use: 'Fondo de la aplicación (azul marino de marca)', ratio: '—' },\n      { name: 'surface', hex: '#131D30', use: 'Superficie elevada: tarjeta, tabla, drawer', ratio: '1,11:1 vs bg' },\n      { name: 'surface-raised', hex: '#1A2540', use: 'Cabecera de tabla, fila en hover', ratio: '1,11:1 vs surface' },\n      { name: 'border', hex: '#2A3854', use: 'Separador decorativo (no control)', ratio: '1,44:1 · decorativo' },\n      { name: 'border-strong', hex: '#5E719A', use: 'Borde de control: input, botón secundario', ratio: '3,45:1 ✓ AA no textual' },\n      { name: 'text', hex: '#E9EEF8', use: 'Texto principal', ratio: '14,49:1 ✓' },\n      { name: 'text-secondary', hex: '#A8B4CB', use: 'Texto secundario, descripciones', ratio: '8,07:1 ✓' },\n      { name: 'text-muted', hex: '#8492AC', use: 'Atenuado: metadatos, encabezados de grupo', ratio: '5,37:1 ✓' },\n      { name: 'accent', hex: '#D9A441', use: 'Acento: superficie, texto e iconos (aquí sí)', ratio: '7,49:1 ✓' },\n      { name: 'accent-hover', hex: '#E8B75C', use: 'Acento en hover; también contorno de foco', ratio: '10,13:1 con on-accent ✓' },\n      { name: 'accent-pressed', hex: '#BE8A2F', use: 'Acento presionado', ratio: '6,12:1 con on-accent ✓' },\n      { name: 'on-accent', hex: '#0B1220', use: 'Texto sobre dorado', ratio: '8,32:1 sobre accent ✓' },\n      { name: 'success', hex: '#4ADE80', use: 'Texto de estado vigente', ratio: '9,67:1 ✓' },\n      { name: 'success-surface', hex: '#10331F', use: 'Fondo de badge/aviso vigente', ratio: '7,95:1 con success ✓' },\n      { name: 'success-border', hex: '#2E7D52', use: 'Borde de badge vigente', ratio: '3,35:1 ✓' },\n      { name: 'warning', hex: '#F5B841', use: 'Texto de advertencia que NO bloquea', ratio: '9,48:1 ✓' },\n      { name: 'warning-surface', hex: '#36280C', use: 'Fondo de aviso ámbar', ratio: '8,06:1 con warning ✓' },\n      { name: 'warning-border', hex: '#96742A', use: 'Borde de aviso ámbar', ratio: '3,87:1 ✓' },\n      { name: 'danger', hex: '#FF8A85', use: 'Bloqueo y acción destructiva', ratio: '7,40:1 ✓' },\n      { name: 'danger-surface', hex: '#3B1618', use: 'Fondo de aviso de bloqueo', ratio: '7,02:1 con danger ✓' },\n      { name: 'danger-border', hex: '#B4565A', use: 'Borde de aviso/badge rojo', ratio: '3,55:1 ✓' },\n      { name: 'on-danger', hex: '#0B1220', use: 'Texto sobre botón destructivo', ratio: '8,23:1 ✓' },\n      { name: 'focus', hex: '#E8B75C', use: 'Contorno de foco', ratio: '10,13:1 ✓' }\n    ];\n\n    const lc = this.state.langClaro, lo = this.state.langOscuro;\n    return {\n      showLight, showDark,\n      previewCols: showLight && showDark ? 'repeat(2, minmax(0, 1fr))' : 'minmax(0, 1fr)',\n      showRatios: this.props.showRatios ?? true,\n      showGuidance: this.props.showGuidance ?? true,\n      tokensLight, tokensDark,\n      rowsLight: rows, rowsDark: rows,\n      drawerClaro: this.state.drawerClaro, drawerOscuro: this.state.drawerOscuro,\n      dialogoClaro: this.state.dialogoClaro, dialogoOscuro: this.state.dialogoOscuro,\n      abrirDrawerClaro: () => this.setState({ drawerClaro: true }),\n      cerrarDrawerClaro: () => this.setState({ drawerClaro: false, dialogoClaro: false }),\n      abrirDrawerOscuro: () => this.setState({ drawerOscuro: true }),\n      cerrarDrawerOscuro: () => this.setState({ drawerOscuro: false, dialogoOscuro: false }),\n      abrirDialogoClaro: () => this.setState({ dialogoClaro: true, drawerClaro: false }),\n      cerrarDialogoClaro: () => this.setState({ dialogoClaro: false }),\n      abrirDialogoOscuro: () => this.setState({ dialogoOscuro: true, drawerOscuro: false }),\n      cerrarDialogoOscuro: () => this.setState({ dialogoOscuro: false }),\n      copiarClaro: () => this.copiar('copiadoClaro'),\n      copiarOscuro: () => this.copiar('copiadoOscuro'),\n      copiarTextoClaro: this.state.copiadoClaro ? 'Copiado' : 'Copiar',\n      copiarTextoOscuro: this.state.copiadoOscuro ? 'Copiado' : 'Copiar',\n      copiadoAvisoClaro: this.state.copiadoClaro ? '✓ Código copiado al portapapeles' : '',\n      copiadoAvisoOscuro: this.state.copiadoOscuro ? '✓ Código copiado al portapapeles' : '',\n      esClaro: () => this.setState({ langClaro: 'ES' }),\n      enClaro: () => this.setState({ langClaro: 'EN' }),\n      esOscuro: () => this.setState({ langOscuro: 'ES' }),\n      enOscuro: () => this.setState({ langOscuro: 'EN' }),\n      langClaroEsBg: lc === 'ES' ? '#D9A441' : '#FFFFFF', langClaroEsFg: lc === 'ES' ? '#23190A' : '#4A5568',\n      langClaroEnBg: lc === 'EN' ? '#D9A441' : '#FFFFFF', langClaroEnFg: lc === 'EN' ? '#23190A' : '#4A5568',\n      langOscuroEsBg: lo === 'ES' ? '#D9A441' : '#131D30', langOscuroEsFg: lo === 'ES' ? '#0B1220' : '#A8B4CB',\n      langOscuroEnBg: lo === 'EN' ? '#D9A441' : '#131D30', langOscuroEnFg: lo === 'EN' ? '#0B1220' : '#A8B4CB'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
